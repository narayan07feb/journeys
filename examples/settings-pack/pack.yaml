# Example pack: Android's own Settings app, present on every emulator.
# Screen rules are written from AOSP Settings' visible texts; check them on your emulator
# with `journeys doctor` and a first run, and adjust the texts for your Android version.
name: settings-demo
app: com.android.settings
# driver: no driver here on purpose: an example has no team. Pass --driver with your team's tool
# (maestro, speedrun or appium; fake for tests), or set driver: in your own pack. Journeys never picks one.
app_packages: [com.android.settings.intelligence]   # Settings' search screen runs here on many versions
env: [DEMO_SEARCH]          # optional variable used by the search journey
hooks:
  note: [hooks/note.sh]     # a tiny example hook: prints its JSON argument
devices:
  allow_settings_changes: emulator
  animations: normal        # speedrun driver only: keeps the animation scales at 1
tap_all:
  # Settings has switches that cut a device off (Wi-Fi, airplane mode) and screens that erase it.
  # tap-all and explore-on-failure never tap here; use them on your own app.
  allowed: false
