# Some drivers read a Settings row as one button whose label joins its texts ("Network &
# internet, Wi-Fi, mobile, data usage, and hotspot"), others as separate texts, so the rules
# match the start of a text with a /regex/. A landscape phone shows only the first rows.
screens:
  SETTINGS-HOME:
    title: Settings home
    match:
      all: [{text: "/^Network & internet/"}]
      any: [{id: search_action_bar}, {text: "/^(Display|Apps|Battery)/"}]
  SETTINGS-DISPLAY:
    title: Display
    match:
      all: [{text: "/^Brightness/"}]
      any: [{text: "/^Dark theme/"}, {text: "/^Screen timeout/"}, {text: "/^Adaptive brightness/"}]
  SETTINGS-ABOUT:
    title: About phone
    match:
      any: [{text: "/^Android version/"}, {text: "/^Device name/"}, {text: "/^Build number/"}]
      none: [{text: "/^Network & internet/"}]
  SETTINGS-SEARCH:
    title: Search
    match:
      all: [{kind: Field}]
      none: [{text: "/^Network & internet/"}]
