# Selectors: "Exact text", or "/regex/" that must match the whole text. A real phone joins a
# row's texts into one label ("Display, Dark theme, font size"), hence the "/Display.*/".
edges:
  - from: SETTINGS-HOME
    to: SETTINGS-DISPLAY
    do:
      - scroll_to: "/Display.*/"
      - tap: "/Display.*/"
  - from: SETTINGS-DISPLAY
    to: SETTINGS-HOME
    do: [back]
  - from: SETTINGS-HOME
    to: SETTINGS-ABOUT
    do:
      - scroll_to: "/About (phone|emulated device|device).*/"
      - tap: "/About (phone|emulated device|device).*/"
  - from: SETTINGS-ABOUT
    to: SETTINGS-HOME
    do: [back]
  - from: SETTINGS-HOME
    to: SETTINGS-SEARCH
    do: [{tap: "Search settings"}]
  - from: SETTINGS-SEARCH
    to: SETTINGS-HOME
    do: [back]
