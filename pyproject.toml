[project]
name = "journeys"
version = "0.1.0"
description = "End-to-end journeys for Android apps, driven by Speedrun, with private per-company packs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
journeys = "journeys.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
